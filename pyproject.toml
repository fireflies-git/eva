[project]
name = "eva"
version = "0.1.0"
description = "shitty ai selfbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "colorama>=0.4.6",
    "discord-py-self>=2.1.0",
    "Pillow>=12.3.0; platform_system == 'Windows'",
    "playwright>=1.40.0",
    "pystray>=0.19.5; platform_system == 'Windows'",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
eva = "main:main"
lint = "eva.cli:run_lint"
tests = "eva.cli:run_tests"
build = "eva.cli:run_build"

[dependency-groups]
dev = [
    "ty>=0.0.24",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "nuitka>=2.5.4",
]

[tool.uv]
package = true
override-dependencies = [
    "curl-cffi>=0.15.0",
    "idna>=3.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python = ".venv"
python-version = "3.12"
root = ["src"]
